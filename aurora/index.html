<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora — Shader Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    a.back {
      position: fixed; top: 1rem; left: 1rem; z-index: 2;
      color: #d7efe4; font: 0.85rem/1 system-ui; text-decoration: none;
      background: rgba(0,0,0,.45); padding: .45rem .7rem; border-radius: 999px;
    }
    a.back:focus-visible { outline: 3px solid #f9bd8e; outline-offset: 3px; }
  </style>
</head>
<body>
<a class="back" href="../docs/index.html">← gallery</a>
<canvas id="c" aria-label="Aurora curtains"></canvas>
<script>
const c = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
c.width = Math.max(1, Math.floor(innerWidth * dpr));
c.height = Math.max(1, Math.floor(innerHeight * dpr));
const gl = c.getContext('webgl');
gl.viewport(0, 0, c.width, c.height);
const v = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(v, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
gl.compileShader(v);
const f = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(f, `precision mediump float;
uniform float u_time; uniform vec2 u_res;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.;a*=.5;}return v;}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  float t=u_time*.22;
  vec3 sky=vec3(.012,.02,.055);
  sky+=vec3(.03,.05,.1)*pow(clamp(1.-uv.y*.35,0.,1.),2.);
  float star=pow(hash(floor(gl_FragCoord.xy*.42)),22.);
  sky+=vec3(.7,.82,1.)*star;
  vec2 q=vec2(fbm(uv*1.15+vec2(t*.35,0.)), fbm(uv*1.15+vec2(1.7,9.2)-t*.2));
  float nearBand=abs(uv.y+.05+q.x*.62);
  float curtain=smoothstep(.72,.02,nearBand)*fbm(vec2(uv.x*1.5+q.y*1.4, uv.y*2.4-t*.4));
  float far=smoothstep(.85,.08,abs(uv.y-.42+q.y*.4))*fbm(uv*2.1+vec2(-t*.12,4.2));
  vec3 farCol=mix(vec3(.02,.12,.28), vec3(.28,.08,.36), far);
  vec3 nearCol=mix(vec3(.04,.48,.32), vec3(.04,.22,.72), curtain);
  nearCol=mix(nearCol, vec3(.72,.22,.78), smoothstep(.42,.88,curtain));
  vec3 col=sky;
  col=mix(col, farCol, clamp(far*.9,0.,1.));
  col=mix(col, nearCol, clamp(curtain*1.2,0.,1.));
  float fold=smoothstep(.15,.55,curtain)*smoothstep(.95,.55,curtain);
  col+=vec3(.55,.9,.7)*fold*.45;
  col*=smoothstep(-1.15,-.15,uv.y);
  gl_FragColor=vec4(col,1.);
}`);
gl.compileShader(f);
const p = gl.createProgram();
gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p); gl.useProgram(p);
const b = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const l = gl.getAttribLocation(p, 'p');
gl.enableVertexAttribArray(l);
gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(p, 'u_time');
const uR = gl.getUniformLocation(p, 'u_res');
gl.uniform2f(uR, c.width, c.height);
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let t = 0, frame = 0;
function draw() {
  frame = 0;
  t += 0.016;
  gl.uniform1f(uT, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!motion.matches) frame = requestAnimationFrame(draw);
}
function sync() {
  if (motion.matches) { if (frame) cancelAnimationFrame(frame); frame = 0; return; }
  if (!frame) frame = requestAnimationFrame(draw);
}
motion.addEventListener('change', sync);
draw();
</script>
</body>
</html>

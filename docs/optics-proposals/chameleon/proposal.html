<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Chameleon lattice proposal — not the guanine filter</title>
<style>*{margin:0}body{background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height);
const v=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(v,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');gl.compileShader(v);
const f=gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(f,`precision highp float;uniform vec2 u_res;
vec3 line(float nm){vec3 q=(vec3(620.,535.,455.)-nm)/vec3(42.,34.,32.);vec3 col=exp(-.5*q*q);return col/max(max(col.r,col.g),max(col.b,.001));}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float a=mix(233.,480.,uv.x);
  float d=127.4;
  float phi=4.*(3.14159265/6.)*pow(d/a,3.);
  float n2=phi*1.83*1.83+(1.-phi)*1.33*1.33;
  float ne=sqrt(n2);
  float mu=clamp(1.-uv.y*.5,.15,1.);
  float lam=2.*ne*a/sqrt(3.)*mu;
  gl_FragColor=vec4(line(lam),1.);
}`);
gl.compileShader(f);
if(!gl.getShaderParameter(f,gl.COMPILE_STATUS))document.title=gl.getShaderInfoLog(f);
const p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(p,'u_res'),c.width,c.height);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Beetle stack proposal — not the live study</title>
<style>*{margin:0}body{background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height);
const v=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(v,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');gl.compileShader(v);
const f=gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(f,`precision highp float;uniform vec2 u_res;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.877,.479,-.479,.877);for(int i=0;i<6;i++){v+=a*noise(p);p=r*p*2.1;a*=.48;}return v;}
vec2 cdiv(vec2 a,vec2 b){float d=dot(b,b);return vec2(dot(a,vec2(b.x,-b.y)),a.y*b.x-a.x*b.y)/max(d,1e-5);}
vec2 layer(vec2 eta,float n,float delta){vec2 num=vec2(eta.x*cos(delta),eta.y*cos(delta)+n*sin(delta));vec2 den=vec2(n*cos(delta)-eta.y*sin(delta),eta.x*sin(delta));return n*cdiv(num,den);}
vec3 line(float nm){vec3 q=(vec3(620.,535.,455.)-nm)/vec3(42.,34.,32.);vec3 col=exp(-.5*q*q);return col/max(max(col.r,col.g),max(col.b,.001));}
float stack(float mu){
  float nc=1.56,na=1.,ns=1.70,lam0=560.;
  float dc=lam0/(4.*nc),da=lam0/4.;
  float sin2=clamp(1.-mu*mu,0.,1.);
  float cc=sqrt(max(1.-sin2/(nc*nc),.0025));
  float ca=sqrt(max(1.-sin2,.0025));
  float lam=lam0*min(cc,ca);
  vec2 eta=vec2(ns,0.);
  for(int i=0;i<7;i++){eta=layer(eta,nc,6.2831853*nc*dc*cc/lam);eta=layer(eta,na,6.2831853*na*da*ca/lam);}
  eta=layer(eta,nc,6.2831853*nc*dc*cc/lam);
  vec2 r=cdiv(vec2(1.,0.)-eta,vec2(1.,0.)+eta);
  return dot(r,r);
}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.;uv.x*=u_res.x/u_res.y;
  float t=.016*.18;
  vec2 w1=vec2(fbm(uv*1.8+vec2(t,t*.7)),fbm(uv*1.8+vec2(t*.6+4.3,-t*.5+1.7)));
  vec2 w2=vec2(fbm(uv*3.5+w1*1.4+t*.5),fbm(uv*3.5+w1*1.4-t*.4+9.1));
  vec3 nrm=normalize(vec3(w2*.8,1.));
  float mu=clamp(nrm.z,.05,1.);
  float R=stack(mu);
  float lam=560.*mu;
  vec3 col=mix(vec3(.04,.02,.01),line(lam),clamp(R,0.,1.));
  gl_FragColor=vec4(col,1.);
}`);
gl.compileShader(f);
if(!gl.getShaderParameter(f,gl.COMPILE_STATUS))document.title=gl.getShaderInfoLog(f);
const p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(p,'u_res'),c.width,c.height);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
</script></body></html>

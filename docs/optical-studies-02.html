const STUDIES=[{"slug": "opal-fire", "name": "Opal Fire", "description": "Small flashes catch the light at several depths beneath a polished surface.", "labels": {"grain": "Domain detail", "paletteShift": "Color bias", "spectral": "Color strength", "roughness": "Roughness"}, "uniforms": {"u_time": {"type": "float", "default": 0, "ui": "hidden", "semanticRole": "light-sweep-time"}, "u_resolution": {"type": "vec2", "default": [512, 512], "ui": "hidden", "semanticRole": "viewport-size"}, "cameraOrbit": {"type": "vec3", "default": [0.35, 0.18, 3.4], "ui": "hidden", "semanticRole": "camera-yaw-pitch-distance"}, "lightDirection": {"type": "vec3", "default": [0, 0, 0], "ui": "hidden", "semanticRole": "optional-world-space-key-light"}, "grain": {"type": "float", "default": 0.48, "ui": "slider", "semanticRole": "Domain detail", "min": 0, "max": 1, "step": 0.01}, "paletteShift": {"type": "float", "default": 0.32, "ui": "slider", "semanticRole": "Color bias", "min": 0, "max": 1, "step": 0.01}, "spectral": {"type": "float", "default": 0.62, "ui": "slider", "semanticRole": "Color strength", "min": 0, "max": 1, "step": 0.01}, "roughness": {"type": "float", "default": 0.26, "ui": "slider", "semanticRole": "Roughness", "min": 0.08, "max": 0.8, "step": 0.01}}, "shader": "#version 300 es\nprecision highp float;\nin vec2 v_uv;\nout vec4 outColor;\nuniform vec2 u_resolution;\nuniform float u_time;\nuniform vec3 cameraOrbit;\nuniform vec3 lightDirection;\nuniform float grain;\nuniform float paletteShift;\nuniform float spectral;\nuniform float roughness;\nconst float PI=3.14159265359;\nconst float TAU=6.28318530718;\nfloat hash31(vec3 p){p=fract(p*vec3(.1031,.11369,.13787));p+=dot(p,p.yzx+19.19);return fract((p.x+p.y)*p.z);}\nvec3 hash33(vec3 p){return vec3(hash31(p),hash31(p+13.7),hash31(p+41.3));}\nfloat noise3(vec3 p){\n vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);\n}\nfloat fbm(vec3 p){return .57*noise3(p)+.28*noise3(p*2.07+5.1)+.15*noise3(p*4.21+13.2);}\nvec3 keyLight(){return length(lightDirection)>.01?normalize(lightDirection):normalize(vec3(-.55+.65*sin(u_time*.25),.65,1.1));}\nvoid camera(out vec3 eye,out vec3 ray){\n vec3 orbit=length(cameraOrbit)>.1?cameraOrbit:vec3(.35,.18,3.4);\n eye=orbit.z*vec3(sin(orbit.x)*cos(orbit.y),sin(orbit.y),cos(orbit.x)*cos(orbit.y));\n vec3 f=normalize(-eye),r=normalize(cross(f,vec3(0,1,0))),u=cross(r,f);\n vec2 p=(v_uv*2.-1.)*vec2(u_resolution.x/max(u_resolution.y,1.),1.);\n ray=normalize(f*2.3+r*p.x+u*p.y);\n}\nbool ellipsoid(vec3 eye,vec3 ray,vec3 radii,out float hit,out vec3 p,out vec3 n){\n vec3 o=eye/radii,d=ray/radii;float a=dot(d,d),b=dot(o,d),c=dot(o,o)-1.,q=b*b-a*c;\n if(q<=0.)return false;hit=(-b-sqrt(q))/a;if(hit<0.)return false;\n p=eye+ray*hit;n=normalize(p/(radii*radii));return true;\n}\nvoid frame(vec3 n,out vec3 t,out vec3 b){t=normalize(cross(abs(n.y)<.9?vec3(0,1,0):vec3(1,0,0),n));b=cross(n,t);}\nfloat panel(vec3 r,vec3 d,vec2 extent,float blur){\n d=normalize(d);vec3 x=normalize(cross(vec3(0,1,0),d)),y=cross(d,x);float z=dot(r,d);\n vec2 p=vec2(dot(r,x),dot(r,y))/max(z,.001),q=1.-smoothstep(extent,extent+blur,abs(p));return q.x*q.y*smoothstep(.01,.15,z);\n}\nvec3 studio(vec3 r,float blur){\n vec3 c=vec3(.009,.013,.019)+vec3(.022,.025,.028)*max(r.y,0.);\n c+=vec3(1.,.96,.9)*panel(r,keyLight(),vec2(.19,.38),.025+blur*.45)*3.4;\n c+=vec3(.8,.91,1.)*panel(r,vec3(.9,.15,.55),vec2(.045,.72),.012+blur*.3)*1.7;\n c+=vec3(.7,.8,.88)*panel(r,vec3(-.2,.9,-.6),vec2(.7,.08),.04+blur*.4)*.7;return c;\n}\nfloat fresnel(float c,float n){float f=(n-1.)/(n+1.);f*=f;return f+(1.-f)*pow(1.-clamp(c,0.,1.),5.);}\n// Authored RGB wavelength bumps: color proxies, not spectral observer integration.\nvec3 wavelength(float nm){vec3 q=(vec3(620.,535.,455.)-nm)/vec3(42.,34.,32.);vec3 c=exp(-.5*q*q);return c/max(max(c.r,c.g),max(c.b,.001));}\nvec3 display(vec3 c){c=max(c,vec3(0));c=c/(1.+max(max(c.r,c.g),c.b));return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(vec3(.0031308),c));}\nvec3 darkStage(vec3 eye,vec3 ray){\n vec3 c=vec3(.0025,.004,.007);\n if(ray.y<-.001){float d=(-1.10-eye.y)/ray.y;vec3 p=eye+ray*d;float pool=exp(-dot(p.xz,p.xz)*.5);c+=vec3(.009,.018,.025)*pool;}\n return c;\n}\nstruct Cell {vec2 id;vec2 local;float edge;};\nCell cells(vec2 p){\n vec2 i=floor(p);float d1=1e5,d2=1e5;vec2 id=vec2(0),local=vec2(0);\n for(int y=-1;y<=1;++y)for(int x=-1;x<=1;++x){vec2 q=i+vec2(float(x),float(y));vec2 r=q+hash33(vec3(q,9.2)).xy-p;float d=dot(r,r);if(d<d1){d2=d1;d1=d;id=q;local=-r;}else if(d<d2)d2=d;}\n return Cell(id,local,sqrt(d2)-sqrt(d1));\n}\n\n// Opal-inspired play-of-color: fixed object-space domains and buried depth slices.\n// This is an appearance model, not a silica diffraction/scattering solver.\nvoid main(){\n vec3 eye,ray;camera(eye,ray);vec3 color=darkStage(eye,ray),p,n;float hit;\n if(ellipsoid(eye,ray,vec3(.92,.98,.64),hit,p,n)){\n  vec3 v=-ray,l=keyLight(),h=normalize(v+l),t,b;frame(n,t,b);\n  float nv=max(dot(n,v),0.),nl=max(dot(n,l),0.);\n  vec3 inside=refract(ray,n,1./1.45);\n  float cloudy=fbm(p*5.1);\n  color=vec3(.018,.028,.036)*(.28+.55*nl)+vec3(.012,.023,.027)*cloudy;\n  float scale=mix(5.5,13.,grain);\n  for(int j=0;j<3;++j){\n   float depth=.075+float(j)*.115;\n   vec3 q=p+inside*depth;\n   Cell cell=cells(q.xy*scale+vec2(q.z*2.3,float(j)*.7));\n   vec3 random=hash33(vec3(cell.id,float(j)+7.));\n   vec3 domainNormal=normalize(n+t*(random.x-.5)*1.25+b*(random.y-.5)*1.15);\n   float alignment=max(dot(domainNormal,h),0.);\n   float flash=exp(-(1.-alignment*alignment)/mix(.024,.12,roughness));\n   float nm=430.+random.z*220.+(paletteShift-.32)*120.+(dot(v,h)-.85)*150.;\n   vec3 chroma=wavelength(nm);\n   float edge=smoothstep(.005,.11,cell.edge);\n   float stipple=.75+.25*noise3(q*75.);\n   float attenuation=exp(- oise sweep across dark mineral plates as the viewing angle changes.", "labels": {"grain": "Layer detail", "paletteShift": "Color bias", "spectral": "Color strength", "roughness": "Roughness"}, "uniforms": {"u_time": {"type": "float", "default": 0, "ui": "hidden", "semanticRole": "light-sweep-time"}, "u_resolution": {"type": "vec2", "default": [512, 512], "ui": "hidden", "semanticRole": "viewport-size"}, "cameraOrbit": {"type": "vec3", "default": [0.35, 0.18, 3.4], "ui": "hidden", "semanticRole": "camera-yaw-pitch-distance"}, "lightDirection": {"type": "vec3", "default": [0, 0, 0], "ui": "hidden", "semanticRole": "optional-world-space-key-light"}, "grain": {"type": "float", "default": 0.48, "ui": "slider", "semanticRole": "Layer detail", "min": 0, "max": 1, "step": 0.01}, "paletteShift": {"type": "float", "default": 0.32, "ui": "slider", "semanticRole": "Color bias", "min": 0, "max": 1, "step": 0.01}, "spectral": {"type": "float", "default": 0.62, "ui": "slider", "semanticRole": "Color strength", "min": 0, "max": 1, "step": 0.01}, "roughness": {"type": "float", "default": 0.26, "ui": "slider", "semanticRole": "Roughness", "min": 0.08, "max": 0.8, "step": 0.01}}, "shader": "#version 300 es\nprecision highp float;\nin vec2 v_uv;\nout vec4 outColor;\nuniform vec2 u_resolution;\nuniform float u_time;\nuniform vec3 cameraOrbit;\nuniform vec3 lightDirection;\nuniform float grain;\nuniform float paletteShift;\nuniform float spectral;\nuniform float roughness;\nconst float PI=3.14159265359;\nconst float TAU=6.28318530718;\nfloat hash31(vec3 p){p=fract(p*vec3(.1031,.11369,.13787));p+=dot(p,p.yzx+19.19);return fract((p.x+p.y)*p.z);}\nvec3 hash33(vec3 p){return vec3(hash31(p),hash31(p+13.7),hash31(p+41.3));}\nfloat noise3(vec3 p){\n vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);\n}\nfloat fbm(vec3 p){return .57*noise3(p)+.28*noise3(p*2.07+5.1)+.15*noise3(p*4.21+13.2);}\nvec3 keyLight(){return length(lightDirection)>.01?normalize(lightDirection):normalize(vec3(-.55+.65*sin(u_time*.25),.65,1.1));}\nvoid camera(out vec3 eye,out vec3 ray){\n vec3 orbit=length(cameraOrbit)>.1?cameraOrbit:vec3(.35,.18,3.4);\n eye=orbit.z*vec3(sin(orbit.x)*cos(orbit.y),sin(orbit.y),cos(orbit.x)*cos(orbit.y));\n vec3 f=normalize(-eye),r=normalize(cross(f,vec3(0,1,0))),u=cross(r,f);\n vec2 p=(v_uv*2.-1.)*vec2(u_resolution.x/max(u_resolution.y,1.),1.);\n ray=normalize(f*2.3+r*p.x+u*p.y);\n}\nbool ellipsoid(vec3 eye,vec3 ray,vec3 radii,out float hit,out vec3 p,out vec3 n){\n vec3 o=eye/radii,d=ray/radii;float a=dot(d,d),b=dot(o,d),c=dot(o,o)-1.,q=b*b-a*c;\n if(q<=0.)return false;hit=(-b-sqrt(q))/a;if(hit<0.)return false;\n p=eye+ray*hit;n=normalize(p/(radii*radii));return true;\n}\nvoid frame(vec3 n,out vec3 t,out vec3 b){t=normalize(cross(abs(n.y)<.9?vec3(0,1,0):vec3(1,0,0),n));b=cross(n,t);}\nfloat panel(vec3 r,vec3 d,vec2 extent,float blur){\n d=normalize(d);vec3 x=normalize(cross(vec3(0,1,0),d)),y=cross(d,x);float z=dot(r,d);\n vec2 p=vec2(dot(r,x),dot(r,y))/max(z,.001),q=1.-smoothstep(extent,extent+blur,abs(p));return q.x*q.y*smoothstep(.01,.15,z);\n}\nvec3 studio(vec3 r,float blur){\n vec3 c=vec3(.009,.013,.019)+vec3(.022,.025,.028)*max(r.y,0.);\n c+=vec3(1.,.96,.9)*panel(r,keyLight(),vec2(.19,.38),.025+blur*.45)*3.4;\n c+=vec3(.8,.91,1.)*panel(r,vec3(.9,.15,.55),vec2(.045,.72),.012+blur*.3)*1.7;\n c+=vec3(.7,.8,.88)*panel(r,vec3(-.2,.9,-.6),vec2(.7,.08),.04+blur*.4)*.7;return c;\n}\nfloat fresnel(float c,float n){float f=(n-1.)/(n+1.);f*=f;return f+(1.-f)*pow(1.-clamp(c,0.,1.),5.);}\n// Authored RGB wavelength bumps: color proxies, not spectral observer integration.\nvec3 wavelength(float nm){vec3 q=(vec3(620.,535.,455.)-nm)/vec3(42.,34.,32.);vec3 c=exp(-.5*q*q);return c/max(max(c.r,c.g),max(c.b,.001));}\nvec3 display(vec3 c){c=max(c,vec3(0));c=c/(1.+max(max(c.r,c.g),c.b));return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(vec3(.0031308),c));}\nvec3 darkStage(vec3 eye,vec3 ray){\n vec3 c=vec3(.0025,.004,.007);\n if(ray.y<-.001){float d=(-1.10-eye.y)/ray.y;vec3 p=eye+ray*d;float pool=exp(-dot(p.xz,p.xz)*.5);c+=vec3(.009,.018,.025)*pool;}\n return c;\n}\nstruct Cell {vec2 id;vec2 local;float edge;};\nCell cells(vec2 p){\n vec2 i=floor(p);float d1=1e5,d2=1e5;vec2 id=vec2(0),local=vec2(0);\n for(int y=-1;y<=1;++y)for(int x=-1;x<=1;++x){vec2 q=i+vec2(float(x),float(y));vec2 r=q+hash33(vec3(q,9.2)).xy-p;float d=dot(r,r);if(d<d1){d2=d1;d1=d;id=q;local=-r;}else if(d<d2)d2=d;}\n return Cell(id,local,sqrt(d2)-sqrt(d1));\n}\n\n// Oriented plate domains in a dark host. Artistic Schiller response,\n// not a mineral optical-constant or lamellar diffraction calculation.\nvoid main(){\n vec3 eye,ray;camera(eye,ray);vec3 color=darkStage(eye,ray),p,n;float hit;\n if(ellipsoid(eye,ray,vec3(1.03,.85,.55),hit,p,n)){\n  vec3 v=-ray,l=keyLight(),h=normalize(v+l),t,b;frame(n,t,b);\n  vec2 uv=mat2(.92,-.39,.39,.92)*p.xy;\n  Cell cell=cells(vec2(uv.x*2.9,uv.y*7.5)+noise3(p*5.)*.32);\n  vec3 rnd=hash33(vec3(cell.id,13.));\n  float grainField=fbm(p*27.);\n  float fractures=(1.-smoothstep(.001,.017,cell.edge))*.28;\n  float striation=.5+.5*sin((uv.x*170.+noise3(p*12.)*2.1));\n  vec3 plate=normalize(vec3((rnd.x-.5)*.54+.06,(rnd.y-.5)*.30+.31,1.));\n  // Domains share a preferred internal orientation, so a broad flash travels\n  // across the stone instead of following a colored silhouette.\n  float alignment=max(dot(plate,h),0.);\n  float flash=exp(-(1.-alignment*alignment)/mix(.006,.040,roughness));\n  float nm=419.+rnd.z*43.+paletteShift*115.+(dot(v,h)-.92)*160.;\n  vec3 schiller=wavelength(nm);\n  float nl=max(dot(n,l),0.),nv=max(dot(n,v),0.);\n  color=mix(vec3(.012,.020,.025),vec3(.048,.055,.052),grainField)*(.28+.6*nl);\n  float terraces=mix(1.,.58+.42*striation,grain);\n  float inclusions=smoothstep(.27,.60,fb function snapshot(){if(!displayed)throw Error('A live frame is required to save a preset.');return JSON.parse(JSON.stringify(displayed))}

$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;if(file.size>32768)throw Error('Preset file is too large.');state=validate(JSON.parse(await file.text()));displayed=null;sync();$('notice').textContent='Preset restored with the light paused.'}catch(e){$('notice').textContent=e.message}finally{$('file').value=''}};
function compile(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(s);gl.deleteShader(s);throw Error(log)}return s}
function init(){gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,alpha:false});if(!gl)throw Error('Live rendering unavailable · static preview');programs=STUDIES.map(s=>{const p=gl.createProgram(),v=compile(gl.VERTEX_SHADER,vertex),f=compile(gl.FRAGMENT_SHADER,s.shader);gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));const uniforms={};for(const name of ['u_resolution','u_time','cameraOrbit','lightDirection','grain','paletteShift','spectral','roughness']){uniforms[name]=gl.getUniformLocation(p,name);if(uniforms[name]===null)throw Error('Inactive required control: '+name)}return {p,uniforms}});lost=false;fallback.hidden=true;canvas.hidden=false;$('controls').disabled=false;$('status').textContent='Live optical study';dirty=true;previous=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function frame(now){const dt=Math.min((now-previous)/1000,.1);previous=now;if(state.playing&&!document.hidden)state.time=(state.time+dt)%86400;const ratio=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,Math.round(canvas.clientWidth*ratio)),h=Math.max(1,Math.round(canvas.clientHeight*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true}if(!lost&&!document.hidden&&(state.playing||dirty)){gl.viewport(0,0,w,h);const {p,uniforms}=programs[STUDIES.findIndex(s=>s.slug===state.slug)];gl.useProgram(p);gl.uniform2f(uniforms.u_resolution,w,h);gl.uniform1f(uniforms.u_time,state.time);gl.uniform3fv(uniforms.cameraOrbit,state.camera);const light=effectiveLight();gl.uniform3fv(uniforms.lightDirection,light);for(const [k,v]of Object.entries(state.uniforms))gl.uniform1f(uniforms[k],v);gl.drawArrays(gl.TRIANGLES,0,3);displayed={version:1,rendererRevision:'optical-02/1.0.0',shaderHash:study().hash,slug:state.slug,uniforms:{...state.uniforms},camera:state.camera.slice(),light:light.slice(),time:state.time};dirty=false;$('light').value=light[0];$('lightValue').value=light[0].toFixed(2)}raf=requestAnimationFrame(frame)}
function fail(message){lost=true;cancelAnimationFrame(raf);fallback.hidden=false;canvas.hidden=true;$('controls').disabled=true;$('status').textContent=message;$('notice').textContent='Showing the default static preview.'}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('Context lost · static preview')});canvas.addEventListener('webglcontextrestored',()=>{try{init()}catch(e){fail(e.message)}});media.addEventListener('change',e=>{if(e.matches){state.playing=false;sync()}});window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));sync();try{init()}catch(e){fail(e.message)}
// Small public state API for repeatable verification and scripted studies.
window.opticalStudio={snapshot,restore(p){state=validate(p);displayed=null;sync()},get state(){return JSON.parse(JSON.stringify(state))},get renderer(){const ext=gl?.getExtension('WEBGL_debug_renderer_info');return ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl?.getParameter(gl.RENDERER)},get error(){return gl?.getError()}};

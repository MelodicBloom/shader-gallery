<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specular Glass</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1b4b; font-family: system-ui, sans-serif; color: #e2e8f0; }
  a.back { position: fixed; top: 12px; left: 12px; color: #f8fafc; background: #111; text-decoration: none; padding: .4rem .7rem; border-radius: 999px; }
  a.back:focus-visible { outline: 3px solid #f9bd8e; outline-offset: 3px; }
  svg { width: min(92vw, 640px); height: auto; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<a class="back" href="./index.html">← recovered studies</a>
<svg viewBox="0 0 640 480" role="img" aria-label="A drinking glass with a moving highlight">
  <defs>
    <filter id="glass-specular" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blurred"/>
      <feSpecularLighting in="blurred" surfaceScale="6" specularConstant="1.1" specularExponent="28" lighting-color="#ffffff" result="specular">
        <fePointLight id="glass-light" x="220" y="80" z="180"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="masked"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="masked"/>
      </feMerge>
    </filter>
    <linearGradient id="bowl" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="#312e81"/>
  <g filter="url(#glass-specular)">
    <path fill="url(#bowl)" stroke="#e0f2fe" stroke-width="3" d="M230 70 H410 L384 300 H256 Z"/>
    <rect x="300" y="300" width="40" height="70" fill="#dbeafe" fill-opacity=".25" stroke="#e0f2fe"/>
    <rect x="250" y="370" width="140" height="14" rx="4" fill="#e0f2fe" fill-opacity=".8"/>
    <path d="M248 110 H392" stroke="#ffffff" stroke-opacity=".55" stroke-width="6"/>
  </g>
</svg>
<script>
const light = document.getElementById('glass-light');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
addEventListener('pointermove', (event) => {
  if (motion.matches) return;
  const box = document.querySelector('svg').getBoundingClientRect();
  light.setAttribute('x', ((event.clientX - box.left) / box.width) * 640);
  light.setAttribute('y', ((event.clientY - box.top) / box.height) * 480);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abalone — Shader Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #info {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(200,220,255,0.5); font: 0.8rem/1 system-ui;
      text-align: center; pointer-events: none;
    }
    #info a { color: rgba(150,220,255,0.7); text-decoration: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Abalone · iridescent thin-film interference · <a href="../docs/index.html">← gallery</a></div>
<script>
const c = document.getElementById('c');
const gl = c.getContext('webgl');

function resize() {
  c.width  = innerWidth  * devicePixelRatio;
  c.height = innerHeight * devicePixelRatio;
  gl.viewport(0, 0, c.width, c.height);
}
resize();
window.addEventListener('resize', resize);

const vert = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vert, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
gl.compileShader(vert);

const fragSrc = `precision mediump float;
uniform float u_time; uniform vec2 u_res;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.877,.479,-.479,.877);for(int i=0;i<6;i++){v+=a*noise(p);p=r*p*2.1;a*=.48;}return v;}
vec3 pearl(float t){vec3 a=vec3(.55,.50,.55),b=vec3(.45,.45,.45),cv=vec3(1,1,1),d=vec3(0.,.15,.40);return a+b*cos(6.28318*(cv*t+d));}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.;uv.x*=u_res.x/u_res.y;
  float t=u_time*.16;
  float dome=1.-dot(uv*.78,uv*.78);
  vec2 w1=vec2(fbm(uv*1.7+vec2(t,t*.6)),fbm(uv*1.7+vec2(4.2,-t*.45)));
  vec2 w2=vec2(fbm(uv*3.3+w1*1.25+t*.35),fbm(uv*3.3+w1*1.25+8.4));
  vec3 n=normalize(vec3((w2-.5)*1.15+uv*.42, .75+dome));
  vec3 l=normalize(vec3(.4+sin(t*.45)*.2,.62,1.));
  vec3 view=vec3(0.,0.,1.);
  float ndl=clamp(dot(n,l),0.,1.);
  float fres=pow(1.-clamp(dot(n,view),0.,1.),2.1);
  float film=fbm(uv*2.+w1*.65)*2.3+ndl*1.35+fres*1.7+t*.18;
  vec3 col=pearl(film)*.7+pearl(film*1.37+.35)*.42;
  col=mix(vec3(.025,.02,.035), col, smoothstep(-.2,.5,dome));
  float spec=pow(clamp(dot(reflect(-l,n),view),0.,1.),46.);
  col+=vec3(1.,.96,.9)*spec*(.28+fres*.7);
  col+=pearl(film)*fres*.32;
  float depth=fbm(uv*1.15+w1*.2);
  col=mix(col*.55,col,smoothstep(.15,.7,depth));
  col*=smoothstep(-.15,.35,dome);
  gl_FragColor=vec4(col,1.);
}`;

const frag = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(frag, fragSrc);
gl.compileShader(frag);

const prog = gl.createProgram();
gl.attachShader(prog, vert); gl.attachShader(prog, frag);
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes  = gl.getUniformLocation(prog, 'u_res');

const motion = matchMedia('(prefers-reduced-motion: reduce)');
let t = 0, frame = 0;
function draw() {
  frame = 0;
  gl.uniform2f(uRes, c.width, c.height);
  t += 0.016;
  gl.uniform1f(uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!motion.matches) frame = requestAnimationFrame(draw);
}
function sync() {
  if (motion.matches) { if (frame) cancelAnimationFrame(frame); frame = 0; return; }
  if (!frame) frame = requestAnimationFrame(draw);
}
motion.addEventListener('change', sync);
draw();
</script>
</body>
</html>

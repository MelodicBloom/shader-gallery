<script type="x-shader" id="scene">// =====================================================================
//  CRYSTAL TUNNEL v2 — scene pass (Shadertoy Buffer A). Optional defines: AA n, LOWQ. Output: rgb = linear HDR,
//  a = circle-of-confusion (fraction of screen height) for the DOF in the post pass.
//  Three counter-rotating DEPTH LAYERS (not radial bands) so rings overlap and occlude:
//    L3 top  (+1 sector/loop): floating brilliant-cut gems, chunky gold gears, beaded gold ring
//    L2 mid  (-1 sector/loop): thick glass panels, 3D silk petals, KIFS crystal clusters
//    L1 deep ( 0)            : band-limited amethyst druse over an emissive fractal floor
//  Exact 40 s loop: log-polar scale-invariant zoom + every time term periodic in the loop.
// =====================================================================
#ifndef AA
#define AA 2
#endif
#define LOOP_T 40.0
#define PI  3.14159265359
#define TAU 6.28318530718

const float NSEC  = 8.0;           // 8-fold rotational, mirrored -> 16 wedges
const float W     = TAU / NSEC;
const float HW    = W * 0.5;
const float P     = 1.0;           // log-radius period (scale e^1 per super-ring)
const float NZOOM = 4.0;           // super-rings per loop (total zoom e^4 = 54.6x)
const float RC    = 0.125;         // core radius (screen units, height = 1)
const float TILT  = 0.62;          // constant radial view tilt = scale-invariant tunnel perspective
const float ZTOP  = 0.56;
const float SC    = 0.72;          // log-space size of one scene unit (real period = SC*P, zoom e^(SC*P*NZOOM)=17.8x)

float gPhase, gPix;

// ---------------------------------------------------------------- utils
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3  hash33(vec3 p3){ p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float sat(float x){ return clamp(x, 0., 1.); }
float smin(float a, float b, float k){ float h = sat(0.5 + 0.5*(b - a)/k); return mix(b, a, h) - k*h*(1. - h); }
vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b * cos(TAU * (c * t + d)); }

// Fold a global warped point (s, angle, z) into one layer's local cell.
// returns (x in [0,P), v in [0,HW], z); par = super-ring parity
vec3 foldL(vec3 p, float rotk){
    float a = p.y - rotk * W * gPhase;               // integer sectors per loop -> periodic
    float v = abs(mod(a + HW, W) - HW);
    float x = p.x - P * floor(p.x / P);
    return vec3(x, v, p.z);
}

// ------------------------------------------------------------ SDF prims
float sdRoundRect(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float sdVesica(vec2 p, float r, float d){
    p = abs(p); float b = sqrt(r*r - d*d);
    return ((p.y - b)*d > p.x*b) ? length(p - vec2(0., b)) : length(p - vec2(-d, 0.)) - r;
}
float extrude(float d2, float z, float h, float rnd){
    vec2 w = vec2(d2 + rnd, abs(z) - h + rnd);
    return min(max(w.x, w.y), 0.) + length(max(w, 0.)) - rnd;
}
float fplane(vec3 q, float phi, float th, vec3 pt){ vec3 n = vec3(sin(th)*cos(phi), sin(th)*sin(phi), cos(th)); return dot(q - pt, n); }
// Full round brilliant (crown + pavilion), girdle radius 1, z up. Polar-folded to one 1/16 wedge.
float sdBrilliant(vec3 q){
    float r = length(q.xy), a = atan(q.y, q.x);
    const float sec = PI / 4.0;
    a = abs(mod(a + sec * 0.5, sec) - sec * 0.5);   // [0, pi/8]
    vec3 w = vec3(r * cos(a), r * sin(a), q.z);
    const float e = PI / 8.0;
    float d = w.z - 0.33;                                                     // table
    d = max(d, fplane(w, 0.0,     0.60, vec3(1.0, 0.0, 0.04)));             // bezel
    d = max(d, fplane(w, e,       0.38, vec3(0.62*cos(e), 0.62*sin(e), 0.33))); // star
    d = max(d, fplane(w, e*0.5,   0.80, vec3(0.99*cos(e*.5), 0.99*sin(e*.5), 0.035))); // upper girdle
    d = max(d, r - 1.0);                                                      // girdle
    d = max(d, fplane(w, 0.0,     PI - 0.711, vec3(1.0, 0.0, -0.03)));      // pavilion main
    d = max(d, fplane(w, e*0.5,   PI - 0.760, vec3(0.99*cos(e*.5), 0.99*sin(e*.5), -0.03))); // lower girdle
    d = max(d, fplane(w, e,       PI - 0.690, vec3(cos(e), sin(e), -0.03)));
    return d;
}
float sdShard(vec3 p, vec3 sz){
    p = abs(p);
    float d = (dot(p / sz, vec3(1)) - 1.0) / length(1.0 / sz);
    d = max(d, p.z - sz.z * 0.55);
    return d;
}
float sdCluster(vec3 p, float sc){        // KIFS branching crystal cluster
    float d = 1e9, s = 1.0; p /= sc;
    for (int i = 0; i < 4; i++){
        p.y = abs(p.y);
        d = min(d, sdShard(p, vec3(0.110, 0.048, 0.060)) / s);
        p.x -= 0.070; p.xy = rot(-0.78 - 0.07*float(i)) * p.xy; p.x -= 0.018;
        p *= 1.42; s *= 1.42;
    }
    return d * sc;
}
float sdGear(vec3 p, float R, float th){
    float rr = length(p.xy), an = atan(p.y, p.x);
    float tooth = clamp(2.4 * cos(an * 12.0), -1., 1.);
    float d2 = rr - (R + 0.12 * R * tooth);
    d2 = max(d2, -(rr - 0.30 * R));                                  // bore
    float sp = abs(mod(an + PI/6.0, PI/3.0) - PI/6.0) * rr;          // 6 spokes
    float win = max(max(0.52*R - rr, rr - 0.78*R), 0.10*R - sp);      // windows between spokes
    d2 = max(d2, -win);
    float g = extrude(d2, p.z, th, th * 0.45);                       // fat bevel
    float hub = extrude(rr - 0.40 * R, p.z - th * 0.25, th * 1.35, th * 0.6);
    hub = max(hub, -(rr - 0.18 * R));
    return min(g, hub);
}

// --------------------------------------------------------------- scene
// materials: 1 gem  2 gold  3 glass  4 silk petal  5 druse  6 floor  7 clear shards
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
float druseAmp;
vec2 layer1(vec3 p){
    vec3 q = foldL(p, 0.0);
    vec2 res = vec2(q.z, 6.0);
    // band-limited druse: amplitude fades out as the cell nears pixel size (no shimmer)
    vec2 cs = vec2(P / 16.0, HW / 6.0);
    float amp = smoothstep(4.0, 11.0, cs.y / gPix);
    druseAmp = amp;
    if (amp > 0.0){
        vec2 g = q.xy / cs, id = floor(g), l = fract(g) - 0.5;
        vec3 h = hash33(vec3(id, 5.0));
        l = rot(h.z * 6.283) * l; l -= (h.xy - 0.5) * 0.22;
        float hh = (0.018 + 0.030 * h.x * h.x) * amp;
        float t = max(max(abs(l.x), abs(l.y) * 1.15), (abs(l.x) + abs(l.y)) * 0.80);
        float zz = hh * (1.0 - 1.9 * t);
        res = opU(res, vec2((q.z - zz) * 0.55, 5.0));
    }
    return res;
}
vec2 layer2(vec3 p){
    vec3 q = foldL(p, -1.0);
    vec2 res = vec2(1e9, 0.0);
    // thick beveled glass panel with pillow lens
    vec3 pp = q - vec3(0.56, HW * 0.5, 0.150);
    float o = sdRoundRect(pp.xy, vec2(0.15, HW * 0.5 - 0.018), 0.045);
    float body = extrude(o, pp.z, 0.038, 0.018);
    float inner = sdRoundRect(pp.xy, vec2(0.105, HW * 0.5 - 0.062), 0.025);
    body = -smin(-body, extrude(inner, pp.z - 0.05, 0.030, 0.010), 0.012);
    body = min(body, extrude(inner + 0.006, pp.z - 0.004, 0.030, 0.026));
    res = opU(res, vec2(body, 3.0));
    // 3D silk petals: lotus fan of 3 cupped, creased, tip-curled shells with real thickness
    {
        vec3 pb = q - vec3(0.63, 0.0, 0.165);
        float best = 1e9, bt = 0.0;
        for (int i = 0; i < 3; i++){
            float fi = float(i);
            float an = 0.42 * fi;                                   // fan angle (mirror completes the flower)
            vec3 pp2 = pb; pp2.xy = rot(-an) * pp2.xy;
            pp2.xz = rot(-0.22 - 0.10 * fi) * pp2.xz;               // petals lift outward
            float L = 0.33 - 0.05 * fi;
            float tt = clamp(pp2.x / L, 0.0, 1.0);
            float wdt = 0.125 * pow(tt, 0.5) * pow(1.0 - tt, 0.42) * 1.55;
            float d2 = max(abs(pp2.y) - wdt, max(-pp2.x, pp2.x - L));
            float yy = pp2.y / max(wdt, 0.02);
            float zc = 0.11 * tt * tt * tt                              // tip curls up
                     + 0.035 * yy * yy * (0.3 + tt)                     // cupped cross-section
                     - 0.006 * exp(-yy * yy * 30.0) * sin(PI * tt)      // mid-rib crease
                     + 0.004 * sin(yy * 9.0 + tt * 6.0) * tt            // silk ripples
                     + 0.035 * fi;                                       // stacked layers
            float sh = extrude(d2 * 0.7, (pp2.z - zc) * 0.8, 0.0055, 0.005) * 0.55;
            if (sh < best){ best = sh; bt = tt; }
        }
        res = opU(res, vec2(best, 4.0 + 0.44 * bt));
    }
    // KIFS clear crystal cluster on the mirror line, under the gems
    vec3 pc = vec3(q.x - 0.16, HW - q.y, q.z - 0.085);
    pc.xy = vec2(pc.y, -pc.x);
    res = opU(res, vec2(sdCluster(pc, 1.35), 7.0));
    vec3 pc2 = vec3(q.x - 0.03, q.y, q.z - 0.07);                // ice cluster on the axis (ref05 outer ice)
    pc2.xy = vec2(-pc2.x, pc2.y);
    res = opU(res, vec2(sdCluster(pc2.yxz, 1.1), 7.0));
    return res;
}
vec2 layer3(vec3 p){
    vec3 q = foldL(p, 1.0);
    vec2 res = vec2(1e9, 0.0);
    // floating round brilliant on the sector axis
    float R = 0.165;
    vec3 pg = (q - vec3(0.27, 0.0, 0.36)) / R;
    res = opU(res, vec2(sdBrilliant(pg) * R, 1.0));
    // chunky polished gold gear on the mirror line
    vec3 pq = q - vec3(0.80, HW, 0.300);
    res = opU(res, vec2(sdGear(pq, 0.115, 0.030) * 0.9, 2.0));
    // swirl ring of elongated sapphire crystals (ref04)
    for (int i = 0; i < 2; i++){
        vec3 pc = q - vec3(0.64 + 0.05 * float(i), HW * (0.30 + 0.45 * float(i)), 0.315 - 0.02 * float(i));
        pc.xy = rot(0.75 + 0.25 * float(i)) * pc.xy;
        pc.xz = rot(-0.25) * pc.xz;
        float cr = sdShard(pc, vec3(0.125 - 0.02 * float(i), 0.030, 0.034));
        res = opU(res, vec2(cr, 7.5));
    }
    // beaded gold ring (rotation-invariant tube + beads that rotate with the layer)
    float tube = length(vec2(q.x - 0.555, q.z - 0.265)) - 0.016;
    float bv = q.y - (HW / 3.0) * floor(q.y / (HW / 3.0) + 0.5);
    float bead = length(vec3(q.x - 0.555, bv, q.z - 0.285)) - 0.026;
    res = opU(res, vec2(min(tube, bead), 2.0));
    return res;
}
vec2 map(vec3 p){
    vec2 res = layer1(p);
    if (p.z - 0.40 < res.x) res = opU(res, layer2(p));          // slab bounds: skip far layers
    if (p.z - ZTOP < res.x) res = opU(res, layer3(p));
    return res;
}
float mapD(vec3 p){ return map(p).x; }
vec3 calcNormal(vec3 p){
    float h = max(gPix * 0.4, 2e-4);
    const vec2 k = vec2(1, -1);
    return normalize(k.xyy*mapD(p + k.xyy*h) + k.yyx*mapD(p + k.yyx*h) + k.yxy*mapD(p + k.yxy*h) + k.xxx*mapD(p + k.xxx*h));
}
float calcAO(vec3 p, vec3 n){
    float occ = 0.0, sca = 1.0;
    for (int i = 0; i < 5; i++){
        float h = 0.006 + 0.028 * float(i);
        occ += (h - mapD(p + n * h)) * sca; sca *= 0.75;
    }
    return sat(1.0 - 3.2 * occ);
}
float softShadow(vec3 ro, vec3 rd){
    float res = 1.0, t = 0.01;
    for (int i = 0; i < 28; i++){
        vec3 p = ro + rd * t;
        if (p.z > ZTOP) break;
        float h = mapD(p);
        res = min(res, 10.0 * h / t);
        t += clamp(h, 0.008, 0.06);
        if (res < 0.01) break;
    }
    return sat(res);
}

// ------------------------------------------------------- palette drift
// periodic in the loop AND in s with period 4P (s -> s+4P at t=T), so it loops exactly
float gS;   // global s of current shading point
float drift(){ return gPhase + gS / (4.0 * P); }
vec3 gemTint(){ float t = TAU * drift();
    vec3 sap = vec3(0.22, 0.42, 1.25), ame = vec3(0.75, 0.28, 1.15), aqu = vec3(0.25, 0.95, 1.05);
    float a = 0.5 + 0.5 * cos(t), b = 0.5 + 0.5 * cos(t - 2.094), c = 0.5 + 0.5 * cos(t + 2.094);
    return (sap * a + ame * b + aqu * c) / (a + b + c); }
vec3 glassTint(){ float t = TAU * (drift() + 0.33);
    vec3 em = vec3(0.18, 1.00, 0.55), te = vec3(0.20, 0.80, 1.10), sa = vec3(0.30, 0.45, 1.20);
    float a = 0.5 + 0.5 * cos(t), b = 0.5 + 0.5 * cos(t - 2.094), c = 0.5 + 0.5 * cos(t + 2.094);
    return (em * a + te * b + sa * c) / (a + b + c); }
vec3 silkTint(){ float t = TAU * (drift() + 0.15);
    vec3 pk = vec3(1.00, 0.55, 0.78), lv = vec3(0.78, 0.62, 1.05), pe = vec3(1.00, 0.72, 0.62);
    float a = 0.5 + 0.5 * cos(t), b = 0.5 + 0.5 * cos(t - 2.094), c = 0.5 + 0.5 * cos(t + 2.094);
    return (pk * a + lv * b + pe * c) / (a + b + c); }
const vec3 LK = vec3(0.4472, 0.2236, 0.8660);        // warm key light from outside/above
const vec3 KEYC = vec3(1.00, 0.86, 0.90);

// ---------------------------------------------------------- environment
vec3 env(vec3 d, float blur){
    d.y = abs(d.y);
    float el = asin(clamp(d.z, -1., 1.));
    float az = atan(d.y, d.x) + 0.30 * sin(TAU * gPhase) + 0.45 * gS;
    float aw = 0.008 + blur;
    vec3 c = mix(vec3(0.004, 0.002, 0.012), vec3(0.020, 0.012, 0.055), sat(d.z));
    c += vec3(0.30, 0.12, 0.75) * 0.12 * exp(-5.0 * abs(el - 0.20));
    float k = az * 14.0 / TAU, id = floor(k), fk = abs(fract(k) - 0.5);
    float hs = hash12(vec2(id, 3.7));
    float wdt = 0.06 + 0.12 * hs, e0 = 0.42 + 0.30 * hs;
    float strip = smoothstep(wdt + aw*2.0, wdt - aw, fk) * smoothstep(aw, -aw, abs(el - e0 - 0.22) - 0.22);
    vec3 sc = mix(vec3(1.0, 0.97, 0.94), mix(vec3(0.55, 0.85, 1.25), vec3(1.0, 0.70, 1.20), step(0.5, hs)), 0.35 * step(0.35, hs));
    c += sc * strip * (6.0 + 14.0 * hs * hs);
    float k2 = (az + 0.17) * 5.0 / TAU, id2 = floor(k2), f2 = abs(fract(k2) - 0.5);
    float h2 = hash12(vec2(id2, 9.1));
    float ov = smoothstep(0.42 + aw, 0.40 - aw, f2) * smoothstep(aw, -aw, abs(el - 1.24) - 0.22);
    c += mix(vec3(0.85, 0.92, 1.15), vec3(1.0, 0.85, 1.1), h2) * ov * (0.35 + 0.65 * smoothstep(1.02, 1.46, el)) * (0.6 + 2.0 * h2);
    float b1 = smoothstep(aw, -aw, abs(az - 0.25) - 0.30) * smoothstep(aw, -aw, abs(el - 0.95) - 0.16);
    c += vec3(1.0, 0.98, 0.97) * 2.0 * b1;
    c += vec3(0.85, 0.85, 1.25) * 4.0 * smoothstep(aw, -aw, abs(el - 1.22) - 0.018);
    // core-side: hot cyan
    c += vec3(0.20, 0.75, 1.60) * 3.0 * smoothstep(0.3, 0.0, abs(az - PI) - 0.55) * smoothstep(0.25, 0.0, abs(el - 0.30) - 0.14);
    return c;
}

// ---------------------------------------------------------- background floor
float kali(vec3 p, vec3 c, float lod){
    float acc = 0., pa = 0., w = 1.0;
    for (int i = 0; i < 7; i++){
        p = abs(p) / dot(p, p) - c;
        float m = dot(p, p);
        acc += exp(-3.5 * abs(m - pa)) * w;
        w *= lod;                                   // LOD: high iterations fade with footprint
        pa = m;
    }
    return acc;
}
vec3 floorColor(vec3 q, float s, float rh){
    float ph = TAU * s / P;
    vec3 kc = vec3(0.78, 0.52, 0.61) + 0.035 * vec3(cos(TAU*gPhase), sin(TAU*gPhase), cos(2.0*TAU*gPhase));
    float lod = 1.0 - smoothstep(0.002, 0.010, gPix);
    float k = kali(vec3(cos(ph)*0.55, sin(ph)*0.55, q.y*1.6 - 0.18), kc, mix(0.55, 1.0, lod));
    float band = 0.5 + 0.5 * cos(ph);
    vec3 deep = mix(vec3(0.008, 0.004, 0.025), vec3(0.050, 0.015, 0.110), band);
    vec3 fil = pal(drift() + 0.1 * q.y, vec3(0.25, 0.25, 0.65), vec3(0.20, 0.25, 0.35), vec3(1.0), vec3(0.75, 0.40, 0.10));
    vec3 col = deep + fil * 0.016 * min(k * k, 9.0);
    col += vec3(0.10, 0.55, 1.40) * 0.14 * exp(-10.0 * max(rh - RC, 0.0));
    col += vec3(0.50, 0.25, 1.00) * 0.08 * exp(-2.0 * max(rh - RC, 0.0));
    return col;
}
// fake caustics from the gem layer, projected along the core light onto the floor
vec3 caustics(vec3 p){
    vec3 Lc = normalize(vec3(-1.0, 0.0, 0.9));
    vec3 pr = p + Lc * ((0.30 - p.z) / Lc.z);          // where the light ray meets the gem plane
    vec3 q = foldL(pr, 1.0);
    vec2 g = (q.xy - vec2(0.27, 0.0)) / 0.165;
    float r = length(g);
    if (r > 1.25) return vec3(0);
    float a = atan(g.y, g.x);
    float f1 = abs(sin(a * 8.0 + 3.0 * r)), f2 = abs(sin(a * 8.0 - 5.0 * r + 1.0));
    vec3 c;
    for (int i = 0; i < 3; i++){
        float rr = r * (1.0 + 0.06 * (float(i) - 1.0));
        float web = pow(1.0 - abs(f1 - f2), 10.0) * smoothstep(1.2, 0.3, rr) + 0.9 * exp(-40.0 * rr * rr);
        c[i] = web;
    }
    return c * 1.6;
}

// ---------------------------------------------------------------- core
vec3 voro3(vec3 x){
    vec3 p = floor(x), f = fract(x);
    float d1 = 8., d2 = 8., id = 0.;
    for (int k = -1; k <= 1; k++) for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
        vec3 b = vec3(i, j, k), h = hash33(p + b);
        vec3 o = 0.5 + 0.38 * sin(TAU * (h + gPhase * vec3(1.0, 2.0, 1.0)));
        vec3 r = b + o - f; float d = dot(r, r);
        if (d < d1){ d2 = d1; d1 = d; id = h.x; } else if (d < d2) d2 = d;
    }
    return vec3(sqrt(d1), sqrt(d2), id);
}
vec4 core(vec2 p){
    float r = length(p), x = r / RC;
    if (x > 1.0) return vec4(0);
    float st = sqrt(max(1.0 - x*x, 0.0));
    vec3 n = vec3(p / RC, st);
    n.xy = rot(TAU * gPhase) * n.xy; n.yz = rot(0.45) * n.yz;
    vec3 cv = voro3(n * 6.5 + 11.0), cv2 = voro3(n * 15.0 + 3.0);
    float edge = cv.y - cv.x, edge2 = cv2.y - cv2.x;
    vec3 base = mix(vec3(0.00, 0.16, 0.75), vec3(0.01, 0.50, 1.25), cv.z * cv.z);
    float shade = 0.55 + 0.45 * st;
    vec3 col = base * (0.45 + 0.55 * smoothstep(0.0, 0.25, edge)) * shade;
    col += vec3(0.08, 0.80, 1.60) * 1.4 * (1.0 - smoothstep(0.0, 0.06, edge));
    col += vec3(0.05, 0.60, 1.30) * 0.5 * (1.0 - smoothstep(0.0, 0.08, edge2)) * shade;
    col += vec3(0.15, 0.75, 1.60) * 1.4 * pow(1.0 - st, 2.5);
    col += vec3(0.5, 0.95, 1.4) * 0.6 * pow(st, 10.0);
    col *= (0.88 + 0.12 * cos(TAU * gPhase * 4.0)) * 1.1;
    float aaw = 1.5 * (1.0 / iResolution.y) / RC;
    return vec4(col, smoothstep(1.0, 1.0 - aaw, x));
}

// --------------------------------------------------------- shading
float fres(float c, float f0){ return f0 + (1.0 - f0) * pow(1.0 - c, 5.0); }
float ggx(vec3 n, vec3 h, float a){ float a2 = a*a, d = dot(n, h); d = d*d*(a2 - 1.0) + 1.0; return a2 / (PI * d * d); }
vec3 coreLightCol(float s){ return vec3(0.30, 0.80, 1.60) * 1.4 * exp(-1.2 * max(SC * (s + gPhase * NZOOM * P) - log(RC), 0.0)); }

vec3 matAlbedo(float m){
    if (m < 1.5) return gemTint();
    if (m < 2.5) return vec3(1.00, 0.74, 0.38);
    if (m < 3.5) return glassTint();
    if (m < 4.5) return silkTint();
    if (m < 5.5) return vec3(0.40, 0.16, 0.85);
    return vec3(0.9, 0.95, 1.05);
}
// cheap shading for secondary (refracted / reflected) hits
vec3 shadeSimple(vec3 p, vec3 rd, float m){
    gS = p.x;
    float rh = exp(SC * (p.x + gPhase * NZOOM * P));
    if (m > 5.5 && m < 6.5) return floorColor(foldL(p, 0.0), p.x, rh) + caustics(p) * coreLightCol(p.x) * 0.25;
    vec3 n = calcNormal(p);
    vec3 Lc = normalize(vec3(-1.0, 0.0, 0.9));
    vec3 cl = coreLightCol(p.x);
    vec3 alb = matAlbedo(m);
    float dif = sat(dot(n, Lc)) * 0.8 + 0.2;
    vec3 R = reflect(rd, n);
    float cosT = sat(-dot(rd, n));
    if (m < 1.5 || m > 6.5) return alb * (env(R, 0.05) * 0.45 + cl * 0.35) + env(R, 0.05) * 0.15;
    if (m < 2.5) return alb * env(R, 0.04) * 0.9 + alb * cl * dif * 0.3;
    if (m < 3.5) return alb * (floorColor(foldL(p, 0.0), p.x, rh) * 2.0 + env(R, 0.05) * fres(cosT, 0.06) * 2.0 + cl * 0.15);
    if (m < 4.5) return alb * (cl * dif * 0.45 + 0.06) + env(R, 0.1) * 0.05;
    return alb * (floorColor(foldL(p, 0.0), p.x, rh) * 0.8 + env(R, 0.03) * 0.2);
}
// march outside the scene from ro along rd; returns hit (t, mat) or t<0
vec2 marchOut(vec3 ro, vec3 rd, int N){
    float t = 0.004;
    for (int i = 0; i < 64; i++){
        if (i >= N) break;
        vec3 p = ro + rd * t;
        if (p.z > ZTOP + 0.02 || p.z < -0.01) return vec2(p.z < 0.0 ? t : -1.0, 6.0);
        vec2 h = map(p);
        if (h.x < gPix * 0.1) return vec2(t, h.y);
        t += h.x * 0.9;
    }
    return vec2(-1.0, 0.0);
}
// march inside the current object until the exit surface
float marchIn(vec3 ro, vec3 rd){
    float t = 0.003;
    for (int i = 0; i < 24; i++){
        float d = -mapD(ro + rd * t);
        if (d < 3e-4) break;
        t += max(d * 0.9, 0.002);
    }
    return t;
}

// full refraction through a dielectric: inner march, per-channel exit, secondary scene march
vec3 refractScene(vec3 p, vec3 V, vec3 n, float ior, float disp, vec3 tint, float m){
    vec3 rdIn = refract(V, n, 1.0 / ior);
    float tin = marchIn(p, rdIn);
    vec3 pe = p + rdIn * tin;
    vec3 ne = calcNormal(pe);
    vec3 col = vec3(0);
    vec3 dirs[3];
    bool tir = false;
    for (int c = 0; c < 3; c++){
        float e = ior + disp * (float(c) - 1.0);
        vec3 o = refract(rdIn, -ne, e);
        if (dot(o, o) < 1e-4){ tir = true; o = reflect(rdIn, -ne); }
        dirs[c] = o;
    }
    if (tir){
        // one more internal bounce, then exit (diamond brilliance / fire)
        vec3 r2 = reflect(rdIn, -ne);
        float t2 = marchIn(pe, r2);
        vec3 pe2 = pe + r2 * t2;
        vec3 ne2 = calcNormal(pe2);
        for (int c = 0; c < 3; c++){
            float e = ior + disp * 1.6 * (float(c) - 1.0);
            vec3 o = refract(r2, -ne2, e);
            if (dot(o, o) < 1e-4) o = normalize(vec3(-reflect(r2, -ne2).xy, 0.6));
            dirs[c] = o;
        }
        pe = pe2;
    }
#ifdef LOWQ
    vec2 h = vec2(-1.0);                                           // low quality: env only behind glass
#else
    vec2 h = marchOut(pe, dirs[1], 44);
#endif
    if (h.x > 0.0){
        // shade the refracted neighbour once; per-channel exit spread adds a dispersion fringe
        vec3 ph = pe + dirs[1] * h.x;
        vec3 sc = shadeSimple(ph, dirs[1], h.y);
        vec3 spread = vec3(dot(dirs[0], dirs[1]), 1.0, dot(dirs[2], dirs[1]));
        col = sc * mix(vec3(1.0), vec3(1.25, 1.0, 1.25), sat((1.0 - min(spread.x, spread.z)) * 60.0));
        col += env(reflect(dirs[1], vec3(0, 0, 1)), 0.0) * 0.08;
    } else {
        for (int c = 0; c < 3; c++) col[c] = env(dirs[c], 0.0)[c];
    }
    // absorption + internal glow along the path
    vec3 absorb = exp(-(1.0 - tint) * tin * 9.0);
    return col * tint * mix(tint, absorb, 0.5) * 1.1;
}

vec4 shadeSample(vec2 p, float time){
    gPhase = fract(time / LOOP_T);
    float r = max(length(p), 1e-5);
    float u = log(r);
    gPix = (1.0 / iResolution.y) / r / SC;
    float s0 = u / SC - gPhase * NZOOM * P;
    float ang = atan(p.y, p.x);
    vec3 V = normalize(vec3(TILT, 0.0, -1.0));
    // ray: reaches the floor (z=0) at s0
    vec3 ro = vec3(s0 - TILT * ZTOP, ang, ZTOP);
    float t = 0.0; vec2 h = vec2(1.0, 6.0);
    for (int i = 0; i < 120; i++){
        vec3 q = ro + V * t;
        if (q.z <= 0.0){ t = ro.z / -V.z; h = vec2(0.0, 6.0); break; }
        h = map(q);
        if (h.x < gPix * 0.06) break;
        t += h.x * 0.9;
    }
    vec3 pos = ro + V * t;
    pos.z = max(pos.z, 0.0);
    float m = h.y;
    gS = pos.x;
    float rh = exp(SC * (pos.x + gPhase * NZOOM * P));
    vec3 Lc = normalize(vec3(-1.0, 0.0, 0.9));
    vec3 cl = coreLightCol(pos.x);
    vec3 col;
    vec3 n = (m > 5.5 && m < 6.5) ? vec3(0, 0, 1) : calcNormal(pos);
#ifdef DEBUGN
    return vec4(n*0.5+0.5, 0.0);
#endif
    float ao = calcAO(pos, n);
#ifdef LOWQ
    float sh = 1.0;                                               // low quality: no shadow march
#else
    float sh = softShadow(pos + n * 0.004, Lc);
#endif
    float cosT = sat(-dot(V, n));
    vec3 R = reflect(V, n);
    float eb = gPix * 10.0;                                       // env pre-filter by footprint
    if (m > 5.5 && m < 6.5){
        vec3 fq = foldL(pos, 0.0);
        col = floorColor(fq, pos.x, rh) * (0.25 + 0.75 * ao);
        col += caustics(pos) * cl * sh * 0.35;
    } else if (m > 4.5 && m < 5.5){
        // amethyst druse (band-limited): dielectric-ish sparkle, faded to floor at distance
        vec3 tint = vec3(0.28, 0.20, 0.62) * mix(vec3(1.0), gemTint(), 0.35);
        vec3 fl = floorColor(foldL(pos, 0.0), pos.x, rh);
        float F = fres(cosT, 0.08);
        vec3 tr = fl * 1.2 + env(normalize(vec3(-n.xy * 2.2 - vec2(0.15, 0.0), 1.0)), eb) * 0.22;
        col = tr * tint * (1.0 - F) + env(R, eb) * F;
        col = mix(fl, col, druseAmp) * (0.30 + 0.70 * ao) * 0.32;
        col += caustics(pos) * cl * sh * 0.25;
        col += tint * cl * sh * 0.12 * sat(dot(n, Lc));
        col += tint * KEYC * 0.10 * sat(dot(n, LK)) * ao * druseAmp;
    } else if (m < 1.5 || (m > 2.5 && m < 3.5) || m > 6.5){
        float ior  = m < 1.5 ? 2.0 : (m > 6.5 ? 1.72 : 1.52);
        float disp = m < 1.5 ? 0.11 : (m > 6.5 ? 0.08 : 0.035);
        vec3 tint  = m < 1.5 ? gemTint() : (m > 7.2 ? mix(vec3(0.45, 0.70, 1.20), gemTint(), 0.3) : (m > 6.5 ? vec3(0.95, 0.97, 1.05) : glassTint()));
        float F = fres(cosT, m < 1.5 ? 0.12 : 0.05);
        vec3 refl = env(R, eb) * (m < 1.5 ? 0.40 : 1.0);
#ifdef LOWQ
        vec2 rr = vec2(-1.0);
#else
        vec2 rr = (m > 2.5 && m < 3.5) ? marchOut(pos + n * 0.003, R, 24) : vec2(-1.0); // reflect neighbours (glass)
#endif
        if (rr.x > 0.0) refl = mix(refl, shadeSimple(pos + n*0.003 + R * rr.x, R, rr.y), 0.7);
        vec3 tr = refractScene(pos, V, n, ior, disp, tint, m);
        col = tr * (1.0 - F) + refl * F;
#ifdef DBGT
        col = tr;
#endif
#ifdef DBGR
        col = refl*F;
#endif
        // internal glow + light piping on glass edges
        col += tint * cl * sh * (m < 1.5 ? 0.22 : 0.10) * (0.4 + 0.6 * pow(1.0 - cosT, 2.0));
        if (m > 2.5 && m < 3.5) col += tint * tint * (0.08 + 0.7 * pow(1.0 - cosT, 2.0));
        vec3 Hc = normalize(Lc - V);
        col += vec3(1.0) * pow(sat(dot(n, Hc)), 600.0) * 40.0 * cl * sh;
        col *= 0.6 + 0.4 * ao;
    } else if (m < 2.5){
        // polished gold, GGX + mirror reflection of the scene
        vec3 f0 = vec3(1.00, 0.68, 0.28);
        vec3 Fm = f0 + (1.0 - f0) * pow(1.0 - cosT, 5.0);
        vec3 refl = env(R, eb + 0.02);
#ifdef LOWQ
        vec2 rr = vec2(-1.0);
#else
        vec2 rr = marchOut(pos + n * 0.003, R, 32);
#endif
        if (rr.x > 0.0) refl = mix(refl, shadeSimple(pos + n*0.003 + R * rr.x, R, rr.y), 0.85);
        vec3 Hc = normalize(Lc - V);
        float spec = ggx(n, Hc, 0.08) * 0.08;
        vec3 Hk = normalize(LK - V);
        col = refl * Fm * 0.75 * (0.35 + 0.65 * ao) + Fm * cl * sh * (spec * 2.0 + 0.10 * sat(dot(n, Lc)));
        col += Fm * KEYC * (ggx(n, Hk, 0.12) * 0.05 + 0.05 * sat(dot(n, LK))) * ao;
    } else {
        // 3D silk petal: base-to-tip gradient, wrap diffuse, sheen, subsurface rim, backlit translucency
        float tt = sat((m - 4.0) / 0.44);
        vec3 alb = silkTint();
        vec3 deepC = alb * vec3(0.70, 0.30, 0.62);
        alb = mix(deepC, mix(alb, vec3(1.0, 0.93, 0.96), 0.30), smoothstep(0.0, 0.85, tt));
        float ndl = dot(n, Lc);
        float wk = sat((dot(n, LK) + 0.25) / 1.25);
        float ndv = cosT;
        float sheen = pow(1.0 - ndv, 3.0);
        float rim = pow(1.0 - ndv, 1.8);
        float trans = pow(sat(dot(V, Lc) * 0.5 + 0.5 - ndl * 0.5), 2.0);  // light through the thin shell
        vec3 film = 0.5 + 0.5 * cos(TAU * ((1.0 - ndv) * 1.4 + tt * 0.8 + vec3(0.0, 0.33, 0.67)));
        col = alb * (KEYC * wk * wk * 1.25 * ao + cl * sat(ndl) * sh * 0.45 + vec3(0.02, 0.012, 0.035));
        col += vec3(1.0, 0.45, 0.65) * alb * (cl * 0.35 + KEYC * 0.25) * trans * (0.4 + 0.6 * tt);   // SSS-ish
        col += mix(alb, vec3(1.0, 0.75, 0.9), 0.5) * rim * 0.35 * (0.5 + 0.5 * ao);
        col += mix(alb, film, 0.55) * sheen * (env(R, 0.15) * 0.25 + cl * 0.30 + 0.12);
        col += env(R, eb + 0.06) * fres(ndv, 0.04) * 0.55;
        col *= (0.22 + 0.78 * ao) * 1.7;
    }
    // atmospheric in-scatter toward the core (volumetric haze)
    col += vec3(0.10, 0.35, 0.90) * 0.06 * exp(-2.5 * max(log(rh / RC), 0.0)) * (1.0 + 2.0 * pos.z);
    // core sphere on top
    vec4 cc = core(p);
    col = mix(col, cc.rgb, cc.a);
    // starburst
    float flare = 0.6 + 0.4 * pow(0.5 + 0.5 * cos(TAU * gPhase * 2.0), 4.0);
    float pva = abs(mod(ang + HW, W) - HW);
    float rr2 = max(r - RC * 0.8, 0.0);
    float star = exp(-r * pva * 200.0) * 1.0 + exp(-r * abs(pva - HW) * 260.0) * 0.5;
    col += vec3(0.75, 0.92, 1.30) * star * exp(-rr2 * 6.0) * 2.2 * flare * smoothstep(RC * 0.6, RC * 1.05, r);
    col += vec3(0.30, 0.70, 1.50) * 0.5 * exp(-rr2 * 25.0) * flare;
    // circle of confusion: focus on the mid rings (screen radius ~0.33) and mid layer depth
    float coc = 0.0065 * max(abs(u - log(0.34)) - 0.45, 0.0) + 0.006 * abs(pos.z - 0.26);
    coc *= 1.0 - cc.a;
    return vec4(col, min(coc, 0.012));
}

void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec4 acc = vec4(0);
    float dt = max(iTimeDelta, 1.0 / 240.0);
    for (int j = 0; j < AA; j++)
    for (int i = 0; i < AA; i++){
        int idx = j * AA + i;
        vec2 o = (vec2(i, j) + 0.5) / float(AA) - 0.5;
        o = rot(0.4636) * o;
        vec2 p = (fragCoord + o - 0.5 * iResolution.xy) / iResolution.y;
        float tj = (float(idx) + hash12(fragCoord + float(idx) * 17.0)) / float(AA*AA) - 0.5;
        acc += shadeSample(p, iTime + tj * dt * 0.5);   // 180-degree shutter motion blur
    }
    fragColor = acc / float(AA*AA);
}

<script type="x-shader" id="post">// =====================================================================
//  CRYSTAL TUNNEL v2 — post (Image pass). iChannel0 = Buffer A (mipmap filter, clamp).
//  rgb = HDR, a = CoC. Depth of field (gather), volumetric light shafts from the core,
//  strong HDR bloom pyramid, chromatic aberration, ACES filmic, vignette, periodic grain.
// =====================================================================
#define LOOP_T 40.0
vec3 ACESFilm(vec3 x){ x *= 0.62; return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 blurLod(vec2 uv, float lod){
    vec2 px = exp2(lod) / iResolution.xy;
    vec3 c = vec3(0); float ws = 0.;
    for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++){
        vec2 o = vec2(i, j); float w = exp(-dot(o, o) * 0.35);
        c += textureLod(iChannel0, uv + o * px * 0.85, lod).rgb * w; ws += w;
    }
    return c / ws;
}
vec3 dof(vec2 uv){
    vec4 c0 = textureLod(iChannel0, uv, 0.0);
    float rad = c0.a * iResolution.y;                     // CoC radius in pixels
    if (rad < 0.6) return c0.rgb;
    vec3 acc = c0.rgb; float ws = 1.0;
    const float GA = 2.39996323;
    float lod = clamp(log2(rad / 5.0), 0.0, 2.0);
    for (int i = 1; i < 28; i++){
        float fi = float(i);
        float rr = sqrt(fi / 27.0) * rad;
        vec2 o = vec2(cos(fi * GA), sin(fi * GA)) * rr / iResolution.xy;
        vec4 s = textureLod(iChannel0, uv + o, lod);
        float w = smoothstep(rr - 1.5, rr + 1.5, s.a * iResolution.y + 1.0);   // scatter-as-gather
        acc += s.rgb * w; ws += w;
    }
    return acc / ws;
}
vec3 shafts(vec2 uv){
    vec2 c = vec2(0.5);
    vec2 d = (c - uv) / 56.0 * 0.92;
    vec2 q = uv; vec3 acc = vec3(0); float dec = 1.0;
    float j = hash13(vec3(gl_FragCoord.xy, 3.0));
    q += d * j;
    for (int i = 0; i < 56; i++){
        q += d;
        vec3 s = textureLod(iChannel0, q, 3.0).rgb;
        acc += max(s - 0.9, 0.0) * dec;
        dec *= 0.962;
    }
    return acc / 56.0;
}
void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 uv = fragCoord / iResolution.xy;
    vec2 cc = uv - 0.5;
    vec2 ca2 = cc * vec2(iResolution.x / iResolution.y, 1.0);
    float r2 = dot(ca2, ca2);
    vec3 col = dof(uv);
    float ca = 0.0035 * r2;                               // radial chromatic aberration
    col.r = mix(col.r, dof(0.5 + cc * (1.0 + ca)).r, 0.85);
    col.b = mix(col.b, dof(0.5 + cc * (1.0 - ca)).b, 0.85);
    vec3 b = vec3(0);
    b += blurLod(uv, 1.0) * 0.26; b += blurLod(uv, 2.0) * 0.24; b += blurLod(uv, 3.0) * 0.22;
    b += blurLod(uv, 4.0) * 0.20; b += blurLod(uv, 5.0) * 0.20; b += blurLod(uv, 6.0) * 0.18;
    b += blurLod(uv, 7.0) * 0.16;
    col += max(b - 0.18, 0.0) * 0.16;
    col += shafts(uv) * vec3(0.55, 0.85, 1.25) * 1.6;
    col *= mix(1.0, smoothstep(1.25, 0.20, r2 * 1.1), 0.6);
    col = ACESFilm(col);
    col = pow(col, vec3(1.0 / 2.2));
#ifndef NOGRAIN
    float fr = floor(mod(iTime, LOOP_T) * 60.0 + 0.5);
    float g = hash13(vec3(fragCoord, fr)) + hash13(vec3(fragCoord + 37.0, fr + 11.0)) - 1.0;
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col += g * (0.018 * (1.0 - lum) * lum * 2.0 + 1.0 / 255.0);
#endif
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}

<script>
// Two-pass Shadertoy-style pipeline in raw WebGL2: Buffer A (scene, RGBA16F HDR + CoC in alpha, mipmapped) -> Image (post).
const LOOP_T = 40.0;
const QUALITY = { low: { scale: 0.5, aa: 1, defs: '#define LOWQ\n' }, high: { scale: 1.0, aa: 2, defs: '' } };
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false });
const err = m => document.getElementById('err').textContent += m + '\n';
if (!gl) err('WebGL2 is not available in this browser.');
if (!gl.getExtension('EXT_color_buffer_float')) err('EXT_color_buffer_float missing: HDR buffer may fail.');
gl.getExtension('OES_texture_float_linear');
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const HDR = d => `#version 300 es
precision highp float; precision highp int;
${d}
uniform vec3 iResolution; uniform float iTime; uniform float iTimeDelta; uniform int iFrame;
uniform sampler2D iChannel0;
out vec4 outColor;
`;
const FTR = `\nvoid main(){ vec4 c; mainImage(c, gl_FragCoord.xy); outColor = c; }`;
function prog(fsrc){
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) err(gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsrc));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) err(gl.getProgramInfoLog(p));
  return p;
}
const sceneSrc = document.getElementById('scene').textContent, postSrc = document.getElementById('post').textContent;
const post = prog(HDR('') + postSrc + FTR);
const scenes = {};
let q = new URLSearchParams(location.search).get('q') || 'low';
const qsel = document.getElementById('q'); qsel.value = q;
function sceneFor(k){ if (!scenes[k]) scenes[k] = prog(HDR('#define AA ' + QUALITY[k].aa + '\n' + QUALITY[k].defs) + sceneSrc + FTR); return scenes[k]; }
qsel.onchange = e => { q = e.target.value; W = 0; };
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
let tex = null, fbo = null, W = 0, H = 0;
function resize(){
  const s = QUALITY[q].scale * Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(16, Math.floor(innerWidth * s)), h = Math.max(16, Math.floor(innerHeight * s));

name: Noise Kaleidoscope EXP-001 Contract
on:
  pull_request:
    paths:
      - "experiments/noise-kaleidoscope-v0/**"
      - ".agents/skills/noise-kaleidoscope-lab/**"
      - ".github/workflows/noise-kaleidoscope-v0-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned to existing repo policy
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned to existing repo policy
        with:
          node-version: 20
      - name: Verify bounded controls and polar invariants
        run: node --test experiments/noise-kaleidoscope-v0/test.mjs

name: BENTHIC_OS Browser QA

on:
  pull_request:
    paths:
      - "benthic-os/**"
      - "docs/index.html"
      - "README.md"
      - "tools/benthic-os-qa.mjs"
      - ".github/workflows/benthic-os-qa.yml"
  push:
    branches: [main]
    paths:
      - "benthic-os/**"
      - "docs/index.html"
      - "README.md"
      - "tools/benthic-os-qa.mjs"
      - ".github/workflows/benthic-os-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/benthic-os-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/benthic-os/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/benthic-os-server.log
          exit 1

      - name: Run desktop, mobile, interaction, and reduced-motion QA
        run: node tools/benthic-os-qa.mjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benthic-os-browser-qa
          path: artifacts/benthic-os-qa
          if-no-files-found: error
          retention-days: 14

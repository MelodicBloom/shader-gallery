name: Landing Page Contract
on:
  pull_request:
    paths:
      - 'index.html'
      - 'README.md'
      - 'tests/landing-*'
      - '.github/workflows/landing-page-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no ubuntu-26.04 (ubuntu-latest) build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test tests/landing-contract.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python tests/landing-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: landing-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: landing-evidence/
          retention-days: 30
          if-no-files-found: error

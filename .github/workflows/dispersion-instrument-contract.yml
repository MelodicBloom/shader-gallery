name: Dispersion Instrument Contract
on:
  pull_request:
    paths:
      - 'optical-studio/instruments/dispersion-lab/**'
      - '.github/workflows/dispersion-instrument-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test dispersion and input contracts
        working-directory: optical-studio/instruments/dispersion-lab
        run: npm test

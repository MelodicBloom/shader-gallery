name: Dispersion Instrument Contract
on:
  pull_request:
    paths:
      - 'optical-studio/instruments/dispersion-lab/**'
      - '.github/workflows/dispersion-instrument-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no ubuntu-26.04 (ubuntu-latest) build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test dispersion and input contracts
        working-directory: optical-studio/instruments/dispersion-lab
        run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify browser input and download
        run: python optical-studio/instruments/dispersion-lab/test-browser.py

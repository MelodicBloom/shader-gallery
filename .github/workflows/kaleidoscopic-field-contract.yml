name: Kaleidoscopic Field Contract
on:
  pull_request:
    paths:
      - 'experiments/kaleidoscopic-field-001/**'
      - '.github/workflows/kaleidoscopic-field-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify bounded control and fixture contracts
        working-directory: experiments/kaleidoscopic-field-001
        run: npm test
      - name: Verify server survives missing directory indexes
        working-directory: experiments/kaleidoscopic-field-001
        run: node tests/server-smoke.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify WebGL2 controls and exported evidence
        working-directory: experiments/kaleidoscopic-field-001
        run: |
          npm run fixture
          python tests/browser-contract.py

